name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and FFmpeg
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev ffmpeg
      - name: Test
        run: swift test
