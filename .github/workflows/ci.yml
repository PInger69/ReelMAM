name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and FFmpeg
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev ffmpeg
      - name: Test
        run: swift test

  app:
    name: App build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and FFmpeg
        run: brew install xcodegen ffmpeg
      - name: Build tests
        run: swift build --build-tests
      - name: Test packages
        timeout-minutes: 12
        run: |
          # If the tests stall, show what is running and where it is stuck before giving up.
          swift test --skip-build &
          tests=$!
          (
            sleep 420
            echo "::error::Tests still running after 7 minutes"
            pgrep -fl 'xctest|swiftpm-testing-helper|ffmpeg|ffprobe' || true
            for pid in $(pgrep -f 'xctest|swiftpm-testing-helper'); do sample "$pid" 2 2>/dev/null | head -220; done
            pkill -f 'ffmpeg|ffprobe' || true
            kill "$tests" || true
          ) &
          watchdog=$!
          wait "$tests"; status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: |
          if ! xcodebuild -project StadaMAM.xcodeproj -scheme StadaMAM -configuration Debug \
              -destination 'platform=macOS' CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -E "error:|error |BUILD FAILED" build.log | sort -u | head -100
            exit 1
          fi
          tail -n 3 build.log
