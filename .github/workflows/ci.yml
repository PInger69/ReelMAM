name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite and FFmpeg
        run: apt-get update -qq && apt-get install -y -qq libsqlite3-dev ffmpeg
      - name: Test
        run: swift test

  app:
    name: App build (macOS)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen and FFmpeg
        run: brew install xcodegen ffmpeg
      - name: Build tests
        run: swift build --build-tests
      - name: Test packages
        timeout-minutes: 12
        run: |
          # If the tests stall, show what is running and where it is stuck before giving up.
          swift test --skip-build &
          tests=$!
          (
            sleep 420
            echo "::error::Tests still running after 7 minutes"
            pgrep -fl 'xctest|swiftpm-testing-helper|ffmpeg|ffprobe' || true
            for pid in $(pgrep -f 'xctest|swiftpm-testing-helper'); do sample "$pid" 2 2>/dev/null | head -220; done
            pkill -f 'ffmpeg|ffprobe' || true
            kill "$tests" || true
          ) &
          watchdog=$!
          wait "$tests"; status=$?
          kill "$watchdog" 2>/dev/null || true
          exit $status
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build app
        run: |
          if ! xcodebuild -project StadaMAM.xcodeproj -scheme StadaMAM -configuration Debug \
              -destination 'platform=macOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build > build.log 2>&1; then
            grep -E "error:|error |BUILD FAILED" build.log | sort -u | head -100
            exit 1
          fi
          tail -n 3 build.log
      - name: Launch the app with sample clips and take screenshots
        continue-on-error: true
        timeout-minutes: 6
        run: |
          mkdir -p demo shots
          i=0
          for src in "testsrc2=size=3840x2160:rate=24000/1001" "mandelbrot=size=1920x1080:rate=24" \
                     "smptehdbars=size=1920x1080:rate=24000/1001" "gradients=size=3840x2160:rate=24" \
                     "rgbtestsrc=size=1920x1080:rate=24000/1001" "cellauto=size=1920x1080:rate=24"; do
            i=$((i+1))
            ffmpeg -hide_banner -loglevel error -y -f lavfi -i "$src" -f lavfi -i "sine=frequency=$((220*i))" -t 4 \
              -c:v prores_ks -profile:v 2 -pix_fmt yuv422p10le -c:a pcm_s16le \
              -timecode "0$i:00:00:00" -metadata:s:v:0 reel_name="A00$i" "demo/A00${i}_C00${i}.mov" || true
          done
          ls -la demo
          STADAMAM_DEMO_MEDIA="$PWD/demo" build/Build/Products/Debug/StadaMAM.app/Contents/MacOS/StadaMAM > app.log 2>&1 &
          sleep 40
          osascript -e 'tell application "StadaMAM" to activate' || true
          sleep 5
          screencapture -x shots/app.png
          tail -n 20 app.log || true
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore
